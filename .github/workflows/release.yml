name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: make lint
      - name: Package plugin
        run: |
          archive="herdr-worktree-setup-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" README.md LICENSE herdr-plugin.toml setup.ts
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes herdr-worktree-setup-*.tar.gz*
