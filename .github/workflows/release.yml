name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make lint
      - name: Package plugin
        run: |
          archive="herdr-worktree-setup-${GITHUB_REF_NAME}.tar.gz"
          bash tools/package-plugin.sh "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes herdr-worktree-setup-*.tar.gz*
